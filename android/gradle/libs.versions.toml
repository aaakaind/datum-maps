[versions]
agp = "9.4.1"
carApp = "1.7.0"
maplibre = "13.6.1"
webkit = "1.17.1"
coreKtx = "1.17.0"
activity = "1.11.0"
junit = "4.13.2"
lifecycle = "2.9.4"
coroutines = "1.10.2"
robolectric = "4.16.1"
orgJson = "20250517"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestExt = "1.3.0"

[libraries]
car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "carApp" }
car-app-testing = { module = "androidx.car.app:app-testing", version.ref = "carApp" }
maplibre = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
